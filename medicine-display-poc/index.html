<!DOCTYPE html>
<html>

<body>
  <h1>WebSocket Test</h1>
  <div id="log"></div>

  <script>
    const log = (msg) => {
      document.getElementById('log').innerHTML += msg + "<br>";
    };
    log("JS runs!")
    setInterval(() => {
      fetch("/test").then((res) => {
        log(res);
      })
    }, 5000)

    const ws = new WebSocket("ws://localhost:3000");

    ws.onopen = () => log("Connected to WebSocket server");
    ws.onmessage = (event) => log("Message from server: " + event.data);

    setTimeout(() => {
      ws.send("Hello from browser!");
    }, 2000);
  </script>
</body>

</html>
