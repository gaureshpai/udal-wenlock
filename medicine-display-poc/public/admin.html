<!doctype html>
<html lang="en">

<head>
    <meta charset="utf-8" />
    <title>Pharmacist Dashboard</title>
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <style>
        :root {
            font-family: system-ui, -apple-system, Segoe UI, Roboto, Arial, sans-serif;
        }

        body {
            margin: 24px;
            background: #f7f7f8;
            color: #111;
        }

        h1 {
            margin: 0 0 12px;
        }

        .card {
            background: #fff;
            border-radius: 16px;
            box-shadow: 0 4px 16px rgba(0, 0, 0, .08);
            padding: 16px;
            position: relative;
        }

        .row {
            display: flex;
            gap: 12px;
            align-items: center;
            flex-wrap: wrap;
        }

        input[type="text"] {
            padding: 10px 12px;
            border-radius: 12px;
            border: 1px solid #dcdcdc;
            min-width: 240px;
        }

        button {
            padding: 10px 14px;
            border-radius: 12px;
            border: 0;
            cursor: pointer;
        }

        .primary {
            background: #2563eb;
            color: #fff;
        }

        .danger {
            background: #ef4444;
            color: #fff;
        }

        .ghost {
            background: #eee;
        }

        .muted {
            color: #666;
            font-size: 14px;
        }

        .table {
            width: 100%;
            border-collapse: collapse;
            margin-top: 12px;
        }

        .table th,
        .table td {
            padding: 10px 8px;
            border-bottom: 1px solid #eee;
            text-align: left;
        }

        .table th {
            position: relative;
            cursor: pointer;
        }

        .table th input {
            width: 90%;
            padding: 4px;
            font-size: 12px;
            margin-top: 4px;
        }

        .sort-arrows {
            margin-left: 6px;
            font-size: 12px;
            user-select: none;
        }

        .arrow {
            cursor: pointer;
            margin: 0 2px;
            color: #888;
            /* grey by default */
            font-weight: bold;
        }

        .arrow.active {
            color: #000;
            /* black when active */
        }

        /* Toggle switch */
        .switch {
            appearance: none;
            width: 42px;
            height: 24px;
            background: #ccc;
            border-radius: 999px;
            position: relative;
            cursor: pointer;
            outline: none;
            transition: background .3s;
        }

        .switch::before {
            content: "";
            position: absolute;
            top: 3px;
            left: 3px;
            width: 18px;
            height: 18px;
            background: #fff;
            border-radius: 50%;
            transition: transform .3s;
        }

        .switch:checked {
            background: #2563eb;
        }

        .switch:checked::before {
            transform: translateX(18px);
        }

        .badge {
            padding: 4px 8px;
            border-radius: 999px;
            font-size: 12px;
        }

        .on {
            background: #dcfce7;
            color: #166534;
        }

        .off {
            background: #fee2e2;
            color: #991b1b;
        }

        /* Fixed footer bar inside card */
        .footer-bar {
            position: sticky;
            bottom: 0;
            left: 0;
            right: 0;
            background: #fff;
            padding: 12px 16px;
            border-top: 1px solid #eee;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .actions {
            display: flex;
            gap: 8px;
        }

        /* 3-dot button */
        .menu-btn {
            background: none;
            border: none;
            font-size: 18px;
            cursor: pointer;
            padding: 4px 8px;
        }

        .dropdown {
            position: absolute;
            background: #fff;
            border: 1px solid #ddd;
            border-radius: 8px;
            box-shadow: 0 2px 6px rgba(0, 0, 0, 0.15);
            display: none;
            min-width: 120px;
            z-index: 1000;
        }

        .dropdown button {
            display: block;
            width: 100%;
            padding: 8px 12px;
            background: none;
            color: #991b1b;
            border: none;
            text-align: left;
            cursor: pointer;
        }

        .dropdown button:hover {
            background: #f5f5f5;
        }
    </style>
</head>

<body>
    <h1>Pharmacist Dashboard</h1>
    <div class="card">
        <div class="row">
            <input id="newName" type="text" placeholder="Add medicine/product name…" />
            <button class="primary" id="addBtn">Add</button>
            <input id="searchBox" type="text" placeholder="Search medicine…" />
            <button class="ghost" id="refreshBtn">Refresh</button>
            <span id="status" class="muted"></span>
        </div>

        <table class="table" id="tbl">
            <thead>
                <tr>
                    <th data-sort="name">
                        Name
                        <span class="sort-arrows">
                            <span class="arrow up" data-dir="asc">↑</span>
                            <span class="arrow down" data-dir="desc">↓</span>
                        </span>
                    </th>
                    <th data-sort="availability">
                        Availability
                        <span class="sort-arrows">
                            <span class="arrow up" data-dir="asc">↑</span>
                            <span class="arrow down" data-dir="desc">↓</span>
                        </span>
                    </th>
                    <th>Enable/Disable</th>
                    <th>Actions</th>
                </tr>
            </thead>

            <tbody id="tbody"></tbody>
        </table>

        <div class="footer-bar">
            <span class="muted">Pending changes: <b id="pendingCount">0</b></span>
            <div class="actions">
                <button id="discardBtn" class="ghost">Discard</button>
                <button id="confirmBtn" class="primary">Confirm changes</button>
            </div>
        </div>
    </div>

    <script>
        const $ = sel => document.querySelector(sel);
        const tbody = $("#tbody"), statusEl = $("#status"), searchBox = $("#searchBox");
        const pending = new Map(); // id -> availability
        let allRows = [];
        let sortField = null, sortAsc = true;

        async function fetchAll() {
            const res = await fetch("/medicines");
            if (!res.ok) throw new Error("Failed to fetch medicines");
            return res.json();
        }

        function applyFilters(rows) {
            const searchTerm = searchBox.value.toLowerCase();
            return rows.filter(r =>
                r.name.toLowerCase().includes(searchTerm)
            );
        }


        function applySort(rows) {
            if (!sortField) return rows;
            return [...rows].sort((a, b) => {
                let av = sortField === "name" ? a.name : a.available;
                let bv = sortField === "name" ? b.name : b.available;
                if (av < bv) return sortAsc ? -1 : 1;
                if (av > bv) return sortAsc ? 1 : -1;
                return 0;
            });
        }

        function render(rows) {
            tbody.innerHTML = "";
            rows = applyFilters(rows);
            rows = applySort(rows);

            for (const r of rows) {
                const tr = document.createElement("tr");
                const effective = pending.has(r.id) ? pending.get(r.id) : r.available;

                tr.innerHTML = `
          <td>${r.name}</td>
          <td><span class="badge ${effective ? "on" : "off"}">${effective ? "Available" : "Not Available"}</span></td>
          <td><input type="checkbox" class="switch" ${effective ? "checked" : ""}></td>
          <td style="position:relative;">
              <button class="menu-btn">⋮</button>
              <div class="dropdown">
                  <button class="deleteBtn">Delete</button>
              </div>
          </td>
        `;

                // toggle availability
                tr.querySelector(".switch").onchange = e => {
                    pending.set(r.id, e.target.checked);
                    updatePendingCount();
                    render(allRows);
                };

                // dropdown toggle
                const menuBtn = tr.querySelector(".menu-btn");
                const dropdown = tr.querySelector(".dropdown");
                menuBtn.onclick = e => {
                    e.stopPropagation();
                    document.querySelectorAll(".dropdown").forEach(d => d.style.display = "none");
                    dropdown.style.display = dropdown.style.display === "block" ? "none" : "block";
                };

                // delete option
                tr.querySelector(".deleteBtn").onclick = async () => {
                    if (!confirm(`Delete "${r.name}"?`)) return;

                    try {
                        if (String(r.id).startsWith("temp") || String(r.id).startsWith("new-")) {
                            allRows = allRows.filter(row => row.id !== r.id);
                            render(allRows);
                            return;
                        }

                        const res = await fetch(`/medicines/${r.id}`, { method: "DELETE" });
                        if (!res.ok) throw new Error("Delete failed");
                        allRows = allRows.filter(row => row.id !== r.id);
                        render(allRows);
                        alert(`"${r.name}" deleted successfully.`);
                    } catch (err) {
                        alert("Error deleting item.");
                        console.error(err);
                    }
                };

                tbody.appendChild(tr);
            }
        }

        function updatePendingCount() {
            $("#pendingCount").textContent = pending.size;
        }

        async function load() {
            statusEl.textContent = "Loading…";
            pending.clear(); updatePendingCount();
            try {
                const data = await fetchAll();
                allRows = data;
                render(allRows);
                statusEl.textContent = `Loaded ${data.length} items`;
            } catch (e) {
                statusEl.textContent = "Error loading data";
                console.error(e);
            }
        }

        $("#addBtn").onclick = async () => {
            const name = $("#newName").value.trim();
            if (!name) return;

            if (!confirm(`Add new medicine "${name}"?`)) return;

            try {
                const res = await fetch("/medicines", {
                    method: "POST",
                    headers: { "Content-Type": "application/json" },
                    body: JSON.stringify({ name, available: true })
                });

                if (!res.ok) throw new Error("Add failed");

                // reload list directly, no pending changes involved
                await load();

                $("#newName").value = "";
                alert(`"${name}" added successfully.`);
            } catch (err) {
                alert("Error adding medicine.");
                console.error(err);
            }
        };



        $("#confirmBtn").onclick = async () => {
            if (!pending.size) return alert("No changes to save.");

            const updates = [];
            const adds = [];

            for (const [id, val] of pending.entries()) {
                if (val.new) adds.push(val);
                else updates.push({ id, available: val });
            }

            const res = await fetch("/medicines/batch", {
                method: "PATCH",
                headers: { "Content-Type": "application/json" },
                body: JSON.stringify({ updates, adds })
            });

            if (res.ok) { alert("Changes saved."); load(); }
            else alert("Save failed.");
        };


        $("#discardBtn").onclick = () => { pending.clear(); updatePendingCount(); load(); };
        $("#refreshBtn").onclick = load;
        searchBox.oninput = () => render(allRows);

        // Sorting
        document.querySelectorAll("th[data-sort]").forEach(th => {
            th.querySelectorAll(".arrow").forEach(arrow => {
                arrow.onclick = () => {
                    // Reset all arrows
                    document.querySelectorAll(".arrow").forEach(a => a.classList.remove("active"));
                    // Activate clicked arrow
                    arrow.classList.add("active");

                    sortField = th.getAttribute("data-sort");
                    sortAsc = arrow.dataset.dir === "asc";
                    render(allRows);
                };
            });
        });

        // close any open dropdown if clicked outside
        document.body.onclick = () => {
            document.querySelectorAll(".dropdown").forEach(d => d.style.display = "none");
        };

        // Warn user if pending changes exist
        window.addEventListener("beforeunload", (e) => {
            if (pending.size > 0) {
                e.preventDefault();
                e.returnValue = ''; // Chrome requires setting returnValue to show dialog
            }
        });


        load();
    </script>
</body>

</html>
