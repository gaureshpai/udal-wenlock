<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Excel to JSON API Uploader</title>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js"></script>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 20px;
        }

        .container {
            background: white;
            border-radius: 16px;
            box-shadow: 0 20px 60px rgba(0, 0, 0, 0.3);
            padding: 40px;
            max-width: 600px;
            width: 100%;
        }

        h1 {
            color: #333;
            margin-bottom: 10px;
            font-size: 28px;
        }

        .subtitle {
            color: #666;
            margin-bottom: 30px;
            font-size: 14px;
        }

        .upload-area {
            border: 2px dashed #667eea;
            border-radius: 12px;
            padding: 40px;
            text-align: center;
            margin-bottom: 20px;
            transition: all 0.3s ease;
            cursor: pointer;
        }

        .upload-area:hover {
            border-color: #764ba2;
            background: #f8f9ff;
        }

        .upload-area.dragover {
            background: #f0f2ff;
            border-color: #764ba2;
        }

        #fileInput {
            display: none;
        }

        .upload-icon {
            font-size: 48px;
            color: #667eea;
            margin-bottom: 10px;
        }

        .upload-text {
            color: #333;
            font-size: 16px;
            margin-bottom: 5px;
        }

        .upload-subtext {
            color: #999;
            font-size: 12px;
        }

        .input-group {
            margin-bottom: 20px;
        }

        label {
            display: block;
            color: #333;
            font-weight: 600;
            margin-bottom: 8px;
            font-size: 14px;
        }

        input[type="text"] {
            width: 100%;
            padding: 12px;
            border: 2px solid #e0e0e0;
            border-radius: 8px;
            font-size: 14px;
            transition: border-color 0.3s ease;
        }

        input[type="text"]:focus {
            outline: none;
            border-color: #667eea;
        }

        button {
            width: 100%;
            padding: 14px;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
            border: none;
            border-radius: 8px;
            font-size: 16px;
            font-weight: 600;
            cursor: pointer;
            transition: transform 0.2s ease, box-shadow 0.2s ease;
        }

        button:hover {
            transform: translateY(-2px);
            box-shadow: 0 10px 20px rgba(102, 126, 234, 0.4);
        }

        button:disabled {
            background: #ccc;
            cursor: not-allowed;
            transform: none;
        }

        .file-info {
            background: #f8f9ff;
            padding: 15px;
            border-radius: 8px;
            margin-bottom: 20px;
            display: none;
        }

        .file-info.show {
            display: block;
        }

        .file-name {
            color: #333;
            font-weight: 600;
            margin-bottom: 5px;
        }

        .file-details {
            color: #666;
            font-size: 12px;
        }

        .status {
            margin-top: 20px;
            padding: 15px;
            border-radius: 8px;
            display: none;
        }

        .status.show {
            display: block;
        }

        .status.success {
            background: #d4edda;
            color: #155724;
            border: 1px solid #c3e6cb;
        }

        .status.error {
            background: #f8d7da;
            color: #721c24;
            border: 1px solid #f5c6cb;
        }

        .status.info {
            background: #d1ecf1;
            color: #0c5460;
            border: 1px solid #bee5eb;
        }
    </style>
</head>
<body>
    <div class="container">
        <h1>📊 Excel to JSON API</h1>
        <p class="subtitle">Upload Excel, convert to JSON, and post to API</p>

        <div class="upload-area" id="uploadArea">
            <div class="upload-icon">📁</div>
            <div class="upload-text">Click to upload or drag and drop</div>
            <div class="upload-subtext">Excel files (.xlsx, .xls)</div>
            <input type="file" id="fileInput" accept=".xlsx,.xls">
        </div>

        <div class="file-info" id="fileInfo">
            <div class="file-name" id="fileName"></div>
            <div class="file-details" id="fileDetails"></div>
        </div>



        <button id="uploadBtn" disabled>Upload to API</button>

        <div class="status" id="status"></div>
    </div>

    <script>
        const API_URL = 'https://script.google.com/macros/s/AKfycbwaFqYcTZm3q48PQQa5m3fU2vn9ovyTS1VQo0GsXurYGMt9_SjOueyuVT8IRxTmJ6pO/exec'; // Replace with your actual API endpoint
        
        let jsonData = null;
        const uploadArea = document.getElementById('uploadArea');
        const fileInput = document.getElementById('fileInput');
        const fileInfo = document.getElementById('fileInfo');
        const fileName = document.getElementById('fileName');
        const fileDetails = document.getElementById('fileDetails');
        const uploadBtn = document.getElementById('uploadBtn');
        const status = document.getElementById('status');

        // Click to upload
        uploadArea.addEventListener('click', () => fileInput.click());

        // Drag and drop
        uploadArea.addEventListener('dragover', (e) => {
            e.preventDefault();
            uploadArea.classList.add('dragover');
        });

        uploadArea.addEventListener('dragleave', () => {
            uploadArea.classList.remove('dragover');
        });

        uploadArea.addEventListener('drop', (e) => {
            e.preventDefault();
            uploadArea.classList.remove('dragover');
            const files = e.dataTransfer.files;
            if (files.length > 0) {
                handleFile(files[0]);
            }
        });

        fileInput.addEventListener('change', (e) => {
            if (e.target.files.length > 0) {
                handleFile(e.target.files[0]);
            }
        });

        function handleFile(file) {
            if (!file.name.match(/\.(xlsx|xls)$/)) {
                showStatus('Please upload a valid Excel file (.xlsx or .xls)', 'error');
                return;
            }

            fileName.textContent = file.name;
            fileDetails.textContent = `Size: ${(file.size / 1024).toFixed(2)} KB`;
            fileInfo.classList.add('show');

            const reader = new FileReader();
            reader.onload = function(e) {
                try {
                    const data = new Uint8Array(e.target.result);
                    const workbook = XLSX.read(data, { type: 'array' });
                    const sheetName = workbook.SheetNames[0];
                    const worksheet = workbook.Sheets[sheetName];
                    const rawData = XLSX.utils.sheet_to_json(worksheet, { header: 1 });

                    // Skip first row (ignored), use 2nd row as header
                    if (rawData.length < 2) {
                        showStatus('Excel file must have at least 2 rows', 'error');
                        return;
                    }

                    const headers = rawData[1];
                    const dataRows = rawData.slice(2); // Start from 3rd row (index 2)

                    // Find last valid row (ignore empty rows at the end)
                    let lastValidIndex = dataRows.length - 1;
                    while (lastValidIndex >= 0 && dataRows[lastValidIndex].every(cell => !cell)) {
                        lastValidIndex--;
                    }

                    // Ignore last 3 valid rows
                    const validDataRows = dataRows.slice(0, Math.max(0, lastValidIndex - 2));

                    if (validDataRows.length === 0) {
                        showStatus('No data rows available after applying filters', 'error');
                        return;
                    }

                    // Convert to JSON
                    jsonData = validDataRows.map(row => {
                        const obj = {};
                        headers.forEach((header, index) => {
                            if (header) {
                                obj[header] = row[index] !== undefined ? row[index] : null;
                            }
                        });
                        return obj;
                    });

                    showStatus(`Successfully processed ${jsonData.length} rows`, 'success');
                    uploadBtn.disabled = false;
                } catch (error) {
                    showStatus('Error processing Excel file: ' + error.message, 'error');
                }
            };
            reader.readAsArrayBuffer(file);
        }

        uploadBtn.addEventListener('click', async () => {
            if (!jsonData) {
                showStatus('Please upload an Excel file first', 'error');
                return;
            }

            showStatus('Uploading data...', 'info');
            uploadBtn.disabled = true;

            try {
                const response = await fetch(API_URL, {
                    method: 'POST',
                    headers: {
                        'Content-Type': 'text/plain', // Use text/plain to avoid CORS preflight
                    },
                    body: JSON.stringify(jsonData),
                    redirect: 'follow'
                });

                if (response.ok || response.type === 'opaque') {
                    showStatus(`✓ Successfully posted ${jsonData.length} rows to Google Sheets`, 'success');
                } else {
                    showStatus(`API returned error: ${response.status} ${response.statusText}`, 'error');
                    uploadBtn.disabled = false;
                }
            } catch (error) {
                // For Google Apps Script, even successful requests might throw CORS errors
                // So we'll assume success if the error is CORS-related
                if (error.message.includes('CORS')) {
                    showStatus(`✓ Data sent to Google Sheets (${jsonData.length} rows)`, 'success');
                } else {
                    showStatus('Error posting to API: ' + error.message, 'error');
                    uploadBtn.disabled = false;
                }
            }
        });

        function showStatus(message, type) {
            status.textContent = message;
            status.className = 'status show ' + type;
        }
    </script>
</body>
</html>
