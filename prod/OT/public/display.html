<!doctype html>
<html lang="en">

<head>
    <meta charset="utf-8">
    <title>OT Schedule</title>
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <link rel="icon" type="image/x-icon" href="/favicon.ico">
    <link href="https://fonts.googleapis.com/css2?family=Roboto:wght@400;500;700&display=swap" rel="stylesheet">
    <style>
        :root {
            --primary-color: #007bff;
            --secondary-color: #6c757d;
            --bg-color: #f8f9fa;
            --text-color: #333;
            --header-bg: #ffffff;
            --table-header-bg: #e9ecef;
            --table-row-bg: #ffffff;
            --table-row-alt-bg: #f8f9fa;
            --border-color: #dee2e6;
            --shadow-color: rgba(0, 0, 0, 0.1);
            --glow-color: #ff0000;
        }

        *,
        *::before,
        *::after {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            font-family: 'Roboto', sans-serif;
            background: var(--bg-color);
            color: var(--text-color);
            display: flex;
            flex-direction: column;
            height: 100vh;
            overflow: hidden;
        }

        header {
            background: var(--header-bg);
            border-bottom: 3px solid var(--primary-color);
            flex-shrink: 0;
            padding: 1vh 3vw;
            height: 12vh;
            display: flex;
            align-items: center;
            justify-content: space-between;
            box-shadow: 0 2px 4px var(--shadow-color);
        }

        header img {
            height: 9vh;
            flex-shrink: 0;
        }

        header .title-container {
            text-align: center;
            flex-grow: 1;
        }

        header h1 {
            margin: 0;
            font-size: 4.5vh;
            font-weight: 700;
            color: var(--primary-color);
        }

        header h2 {
            margin: 0;
            font-size: 2.8vh;
            font-weight: 400;
            color: var(--secondary-color);
        }

        main {
            flex: 1;
            overflow: hidden;
            height: calc(100vh - 18vh);
            display: flex;
            flex-direction: column;
            padding: 2vh 3vw;
        }

        #tableHeader {
            flex-shrink: 0;
            background: var(--table-header-bg);
            border-radius: 8px 8px 0 0;
            overflow: hidden;
        }

        #scrollViewport {
            flex-grow: 1;
            overflow-y: hidden;
            background: var(--table-row-bg);
            border-radius: 0 0 8px 8px;
            box-shadow: 0 2px 4px var(--shadow-color);
        }

        table {
            width: 100%;
            border-collapse: collapse;
            table-layout: fixed;
        }

        thead th {
            background-color: var(--primary-color);
            color: var(--header-bg);
            padding: 2vh 1vw;
            font-size: 3vh;
            font-weight: 500;
            text-align: center;
            position: sticky;
            top: 0;
            z-index: 1;
        }

        td {
            padding: 1.5vh 1vw;
            font-weight: 500;
            font-size: 3.5vh;
            vertical-align: middle;
            text-align: center;
            border-bottom: 1px solid var(--border-color);
            white-space: nowrap;
        }
        
        tr {
            animation: fadeIn 0.5s ease-in-out;
        }
        
        .glow-text {
            animation: glow 1s infinite alternate;
        }
        
        @keyframes glow {
            from {
                color: black;
            }
            to {
                color:  red;
            }
        }

        @keyframes fadeIn {
            from {
                opacity: 0;
                transform: translateY(10px);
            }
            to {
                opacity: 1;
                transform: translateY(0);
            }
        }

        tr:last-child td {
            border-bottom: 0;
        }

        .kannada-text {
            font-size: 2.2vh;
            font-weight: 400;
            line-height: 1.6;
            color: var(--secondary-color);
            margin-top: 0.8vh;
        }

        .empty {
            padding: 50px 20px;
            text-align: center;
            color: var(--secondary-color);
            font-size: 20px;
            display: none;
        }

        footer {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 1.5vh 3vw;
            border-top: 1px solid var(--border-color);
            font-size: 2.2vh;
            color: var(--secondary-color);
            height: 6vh;
        }
    </style>
</head>

<body>
    <header>
        <img src="./wenlock_logo.png" alt="Wenlock Logo">
        <div class="title-container">
            <h1>OT Schedule</h1>
            <h2>ಆಪರೇಷನ್ ಥಿಯೇಟರ್ ವೇಳಾಪಟ್ಟಿ</h2>
        </div>
    </header>

    <main>
        <div id="tableHeader">
            <table>
                <thead>
                    <tr>
                        <th>Patient Name</th>
                        <th>Age</th>
                        <th>Procedure Name</th>
                        <th>Department</th>
                        <th>Disease</th>
                        <th>Status</th>
                    </tr>
                </thead>
            </table>
        </div>
        <div id="scrollViewport">
            <table>
                <tbody id="otBody"></tbody>
            </table>
        </div>
        <div id="empty" class="empty">No OT data available</div>
    </main>

    <footer>
        <span id="meta"></span>
        <span id="pageInfo"></span>
    </footer>

    <script>
        const PAGE_HOLD_MS = 10000;
        const SLIDE_MS = 1200;
        const REFRESH_MS = 15000;

        const tbody = document.getElementById("otBody");
        const viewport = document.getElementById("scrollViewport");
        const empty = document.getElementById("empty");
        const meta = document.getElementById("meta");
        const pageInfo = document.getElementById("pageInfo");

        let otData = [];
        let currentIndex = 0;
        let rowHeight = 0;
        let pageTimer = null;
        let refreshTimer = null;
        let lastHash = "";
        let rowsPerPage = 0;

        function sleep(ms, cb) {
            setTimeout(cb, ms);
        }

        async function fetchData() {
            try {
                const response = await fetch('/data');
                if (!response.ok) {
                    throw new Error(`HTTP error, status = ${response.status}`);
                }
                const data = await response.json();
                return data;
            } catch (error) {
                console.error("Error fetching data:", error);
                return null;
            }
        }

        function hashData(list) {
            return JSON.stringify(list);
        }

        function setScrollTop(yPx, withAnimation) {
            if (withAnimation) {
                const start = viewport.scrollTop;
                const end = yPx;
                const duration = SLIDE_MS;
                let startTime = null;

                function animationStep(timestamp) {
                    if (!startTime) startTime = timestamp;
                    const progress = timestamp - startTime;
                    const percentage = Math.min(progress / duration, 1);
                    viewport.scrollTop = start + (end - start) * (1 - Math.cos(Math.PI * percentage)) / 2; // Easing function
                    if (progress < duration) {
                        requestAnimationFrame(animationStep);
                    }
                }
                requestAnimationFrame(animationStep);
            } else {
                viewport.scrollTop = yPx;
            }
        }

        function renderRows(data) {
    return new Promise(resolve => {
        tbody.innerHTML = "";

        if (!data || data.length === 0) {
            empty.style.display = "block";
            resolve();
            return;
        }

        empty.style.display = "none";
        data.forEach(item => {
            const tr = document.createElement("tr");

            const fields = [
                "Patient Name",
                "Age",
                "Procedure Name",
                "Department",
                "Disease",
                "Status"
            ];

            const cellsHtml = fields
                .map(key => {
                    const itemKey = key;
                    const content = item[itemKey] || "-";
                    const kannadaContent = item[`kn_${itemKey}`] || "";
                    
                    let glowClass = '';
                    if (key === 'Status' && content.toLowerCase() === 'in progress') {
                        glowClass = 'glow-text';
                    }

                    return `
                        <td>
                            <div class="text-pair">
                                <div class="english-text ${glowClass}">${content}</div>
                                <div class="kannada-text">${kannadaContent}</div>
                            </div>
                        </td>
                    `;
                })
                .join("");

            tr.innerHTML = cellsHtml;
            tbody.appendChild(tr);
        });

        requestAnimationFrame(() => {
            const firstRow = tbody.querySelector("tr");
            if (firstRow) {
                const style = window.getComputedStyle(firstRow);
                rowHeight = parseFloat(style.height);
            }
            if (rowHeight > 0) {
                rowsPerPage = Math.floor(viewport.clientHeight / rowHeight);
            }
            currentIndex = 0;
            setScrollTop(0, false);
            
            tbody.querySelectorAll('.text-pair').forEach(pair => {
                const englishDiv = pair.querySelector('.english-text');
                const kannadaDiv = pair.querySelector('.kannada-text');
                if (englishDiv.scrollWidth > englishDiv.clientWidth || kannadaDiv.scrollWidth > kannadaDiv.clientWidth) {
                    const englishHTML = englishDiv.innerHTML;
                    const kannadaHTML = kannadaDiv.innerHTML;
                    pair.innerHTML = `<marquee behavior="scroll" direction="left" scrollamount="4">
                                        <div class="english-text">${englishHTML}</div>
                                        <div class.kannada-text">${kannadaHTML}</div>
                                      </marquee>`;
                }
            });

            resolve();
        });
    });
}
        function goToPage(pageIdx) {
            if (rowsPerPage === 0) return;

            currentIndex = Math.min(pageIdx * rowsPerPage, Math.max(0, otData.length - 1));
            const offset = currentIndex * rowHeight;
            setScrollTop(offset, true);
            const pageCount = Math.ceil(otData.length / rowsPerPage);
            pageInfo.textContent = `Page ${Math.floor(currentIndex / rowsPerPage) + 1} of ${pageCount}  (${otData.length} entries)`;
        }

        function stepPager() {
            if (document.hidden || otData.length <= rowsPerPage) return;

            const pageCount = Math.ceil(otData.length / rowsPerPage);
            const currentPage = Math.floor(currentIndex / rowsPerPage);
            let nextPage = (currentPage + 1);

            if (nextPage >= pageCount) {
                sleep(SLIDE_MS, () => setScrollTop(0, true)); // Smooth scroll to top
                nextPage = 0;
            }

            goToPage(nextPage);
        }

        function startPager() {
            stopPager();
            pageTimer = setInterval(stepPager, PAGE_HOLD_MS);
        }

        function stopPager() {
            if (pageTimer) clearInterval(pageTimer);
            pageTimer = null;
        }

        async function refreshLoop() {
            const payload = await fetchData();
            if (!payload) {
                meta.textContent = "Error fetching data. Retrying...";
                return;
            }

            const list = Array.isArray(payload) ? payload : [];
            const newHash = hashData(list);
            
            if (newHash !== lastHash) {
                otData = list;
                await renderRows(otData);
                lastHash = newHash;
                goToPage(0);
                 if (otData.length > rowsPerPage) {
                    startPager();
                } else {
                    stopPager();
                }
            }
             meta.textContent = `Last updated: ${new Date().toLocaleTimeString('en-US', { hour: 'numeric', minute: 'numeric', hour12: true })}`;
        }



        function startRefresh() {
            stopRefresh();
            refreshLoop();
            refreshTimer = setInterval(refreshLoop, REFRESH_MS);
        }

        function stopRefresh() {
            if (refreshTimer) clearInterval(refreshTimer);
            refreshTimer = null;
        }

        document.addEventListener("visibilitychange", () => {
            if (document.hidden) {
                stopPager();
            } else {
                 if (otData.length > rowsPerPage) {
                    startPager();
                }
            }
        });

        window.addEventListener("resize", () => {
            if (!otData.length) return;
            renderRows(otData).then(() => {
                goToPage(0);
                 if (otData.length > rowsPerPage) {
                    startPager();
                }
            });
        });

        startRefresh();
    </script>
</body>

</html>
