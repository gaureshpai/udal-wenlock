<!doctype html>
<html lang="en">

<head>
    <meta charset="utf-8">
    <title>Blood Requests</title>
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <link rel="icon" type="image/x-icon" href="/favicon.ico">
    <style>
        *,
        *::before,
        *::after {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            font-family: Arial, sans-serif;
            background: #f9fafb;
            color: #111;
            display: flex;
            flex-direction: column;
            height: 100vh;
            overflow: hidden;
        }

        header {
            background: #fff;
            border-bottom: 2px solid #e5e7eb;
            flex-shrink: 0;
            padding: 0 2vw;
            height: 10vh;
        }

        main {
            flex: 1;
            overflow: hidden;
            height: calc(100vh - 15vh);
            display: flex;
            flex-direction: column;
        }

        #tableHeader {
            flex-shrink: 0;
        }

        #scrollViewport {
            flex-grow: 1;
            overflow-y: hidden;
            background: #fff;
        }

        table {
            width: 100%;
            border-collapse: collapse;
            table-layout: fixed;
        }

        thead th {
            background-color: #e5e7eb;
            padding: 1.5vh 1vw;
            font-size: 2.8vh;
            font-weight: bold;
            text-align: center;
            position: sticky;
            top: 0;
            z-index: 1;
        }

        th:nth-child(1) {
            width: 25%;
        }

        th:nth-child(2) {
            width: 10%;
        }

        th:nth-child(3) {
            width: 45%;
        }

        th:nth-child(4) {
            width: 20%;
        }

        tbody {
            transition: transform 0.8s ease;
        }

        td {
            padding: 1.2vh 1vw;
            font-weight: bold;
            font-size: 3.2vh;
            vertical-align: middle;
            background-color: #fff;
            text-align: center;
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
            border-bottom: 1px solid #ddd;
        }

        tr:nth-child(even) td {
            background-color: #f3f4f6;
        }

        td.status-emergency {
            color: #fff;
            background-color: #dc2626 !important;
        }

        .kannada-text {
            font-size: 2.5vh;
            font-weight: bold;
            line-height: 1.5;
            color: #333;
            margin-top: 0.5vh;
        }

        .empty {
            padding: 40px 20px;
            text-align: center;
            color: #6b7280;
            font-size: 18px;
            display: none;
        }

        footer {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 1vh 2vw;
            border-top: 2px solid #e5e7eb;
            font-size: 2.5vh;
            color: #374151;
            height: 5vh;
        }

        #toast-container {
            flex-grow: 1;
            text-align: center;
            overflow: hidden;
            position: relative;
            height: 100%;
        }

        .toast-message {
            position: absolute;
            width: 100%;
            height: 100%;
            display: flex;
            justify-content: center;
            align-items: center;
            opacity: 0;
            transition: opacity 0.5s ease-in-out, transform 0.5s ease-in-out;
            transform: translateY(100%);
        }

        .toast-message.active {
            opacity: 1;
            transform: translateY(0);
        }

        .toast-message.exiting {
            opacity: 0;
            transform: translateY(-100%);
        }

        .component-grid {
            display: grid;
            gap: 0.5vh 1vw;
            width: 100%;
        }

        .component-grid-item {
            padding: 0.5vh;
            font-size: 2.2vh;
            font-weight: normal;
            text-align: left;
            background-color: #f3f4f6;
            border-radius: 4px;
            padding: 1vh;
            border: #111 solid 1px;
        }

        .component-grid-item .kannada-text {
            font-size: 2vh;
            color: #555;
            margin-top: 0.2vh;
            line-height: 1.2;
        }
    </style>
</head>

<body>
    <header style="display: flex; align-items: center; justify-content: space-between;">
        <img src="./wenlock_logo.png" alt="Wenlock Logo" style="height: 8vh; flex-shrink: 0;">
        <div style="text-align: center; flex-grow: 1;">
            <h1 style="margin: 0; font-size: 4vh;">Blood Requests</h1>
            <h2 style="margin: 0; font-size: 2.5vh; font-weight: normal;">ರಕ್ತದಾನ ವಿನಂತಿಗಳು</h2>
        </div>
    </header>

    <main>
        <div id="tableHeader">
            <table>
                <thead>
                    <tr>
                        <th>Name</th>
                        <th>Age</th>
                        <th>Component</th>
                        <th>Status</th>
                    </tr>
                </thead>
            </table>
        </div>
        <div id="scrollViewport">
            <table>
                <tbody id="bloodBody"></tbody>
            </table>
        </div>
        <div id="empty" class="empty">No blood data available</div>
    </main>

    <footer>
        <span id="meta"></span>
        <div id="toast-container"></div>
        <span id="pageInfo"></span>
    </footer>

    <script>
        const PAGE_HOLD_MS = 4200;
        const SLIDE_MS = 800;
        const REFRESH_MS = 10000;
        const ALERT_DISPLAY_MS = 3000;

        const tbody = document.getElementById("bloodBody");
        const viewport = document.getElementById("scrollViewport");
        const empty = document.getElementById("empty");
        const meta = document.getElementById("meta");
        const pageInfo = document.getElementById("pageInfo");
        const toastContainer = document.getElementById("toast-container");

        let bloodData = [];
        let currentIndex = 0;
        let rowHeight = 0;
        let pageTimer = null;
        let refreshTimer = null;
        let lastHash = "";
        let rowsPerPage = 0;

        let alertMessages = [];
        let currentAlertIndex = 0;
        let alertTimer = null;
        let isAlertAnimating = false;

        function sleep(ms, cb) {
            setTimeout(cb, ms);
        }

        function cycleAlerts() {
            if (alertMessages.length === 0 || isAlertAnimating) {
                return;
            }
            isAlertAnimating = true;

            const currentMessage = toastContainer.querySelector('.toast-message');
            if (currentMessage) {
                currentMessage.classList.add('exiting');
                currentMessage.classList.remove('active');
                setTimeout(() => {
                    currentMessage.remove();
                }, 500);
            }

            const newMessage = document.createElement('div');
            newMessage.className = 'toast-message';
            newMessage.innerHTML = alertMessages[currentAlertIndex];
            toastContainer.appendChild(newMessage);

            setTimeout(() => {
                newMessage.classList.add('active');
            }, 100);

            currentAlertIndex = (currentAlertIndex + 1) % alertMessages.length;

            setTimeout(() => {
                isAlertAnimating = false;
            }, 1000);
        }

        async function fetchAlerts() {
            try {
                const response = await fetch('/alerts.csv');
                if (!response.ok) {
                    throw new Error(`HTTP error, status = ${response.status}`);
                }
                const csvText = await response.text();
                const lines = csvText.split('\n').slice(1);
                alertMessages = lines
                    .map(line => line.trim())
                    .filter(line => line)
                    .map(line => line.slice(1, -1));

                if (alertMessages.length > 0) {
                    cycleAlerts();
                    if (alertMessages.length > 1) {
                        alertTimer = setInterval(cycleAlerts, ALERT_DISPLAY_MS);
                    }
                }
            } catch (error) {
                console.error("Error fetching alerts:", error);
            }
        }

        async function fetchData() {
            try {
                const response = await fetch('/data');
                if (!response.ok) {
                    throw new Error(`HTTP error, status = ${response.status}`);
                }
                const data = await response.json();
                return data;
            } catch (error) {
                console.error("Error fetching data:", error);
                return null;
            }
        }

        function hashData(list) {
            return JSON.stringify(list.map(item => `${item.Name}-${item.kn_name}-${item.Status}`));
        }

        function setScrollTop(yPx, withAnimation) {
            if (withAnimation) {
                const start = viewport.scrollTop;
                const end = yPx;
                const duration = SLIDE_MS;
                let startTime = null;

                function animationStep(timestamp) {
                    if (!startTime) startTime = timestamp;
                    const progress = timestamp - startTime;
                    const percentage = Math.min(progress / duration, 1);
                    viewport.scrollTop = start + (end - start) * percentage;
                    if (progress < duration) {
                        requestAnimationFrame(animationStep);
                    }
                }
                requestAnimationFrame(animationStep);
            } else {
                viewport.scrollTop = yPx;
            }
        }

        function renderRows(data) {
            return new Promise(resolve => {
                tbody.innerHTML = "";
                if (!data || data.length === 0) {
                    empty.style.display = "block";
                    resolve();
                    return;
                }
                empty.style.display = "none";
                for (let i = 0; i < data.length; i++) {
                    const item = data[i];
                    const tr = document.createElement("tr");

                    const tdName = document.createElement("td");
                    const englishName = document.createElement('div');
                    englishName.textContent = (item.Name || "-").toUpperCase();
                    tdName.appendChild(englishName);
                    if (item.kn_name) {
                        const kannadaName = document.createElement('div');
                        kannadaName.className = 'kannada-text';
                        kannadaName.textContent = item.kn_name;
                        tdName.appendChild(kannadaName);
                    }
                    tr.appendChild(tdName);

                    const tdAge = document.createElement("td");
                    tdAge.textContent = item.Age || "-";
                    tr.appendChild(tdAge);

                    const tdComponent = document.createElement("td");
                    const componentGrid = document.createElement("div");
                    componentGrid.className = "component-grid";

                    const labels = [
                        { en: "PRBC", kn: "ಪ್ಯಾಕ್‌ಡ್ ರೆಡ್ ಬ್ಲಡ್ ಸೆಲ್ಸ್", key: "PRBC" },
                        { en: "FFP", kn: "ತಜ್ಜಲಿತ ಪ್ಲಾಸ್ಮಾ", key: "FFP" },
                        { en: "PLATELET CONCENTRATE", kn: "ಪ್ಲೇಟ್ಲೆಟ್ ಕಾಂಸೆಂಟ್ರೇಟ್", key: "PLATELET_CONCENTRATE" },
                        { en: "CRYOPRECIPITATE", kn: "ಕ್ರಯೋಪ್ರೆಸಿಪಿಟೇಟ್", key: "CRYOPRECIPITATE" },
                        { en: "CRYOPOOR PLASMA", kn: "ಕ್ರಯೋಪೂರ್ ಪ್ಲಾಸ್ಮಾ", key: "CRYOPOOR_PLASMA" }
                    ];

                    const neededComponents = labels.filter(label => item[label.key]);
                    const count = neededComponents.length;

                    if (count === 1) {
                        componentGrid.style.gridTemplateColumns = "1fr";
                    } else if (count === 2) {
                        componentGrid.style.gridTemplateColumns = "1fr 1fr";
                    } else if (count >= 3) {
                        componentGrid.style.gridTemplateColumns = "1fr 1fr";
                    }

                    neededComponents.forEach(row => {
                        const gridItem = document.createElement("div");
                        gridItem.className = "component-grid-item";

                        const englishDiv = document.createElement("div");
                        englishDiv.textContent = `${row.en} - ${item[row.key]}`;
                        gridItem.appendChild(englishDiv);

                        if (item[`kn_${row.key}`]) {
                            const kannadaDiv = document.createElement("div");
                            kannadaDiv.className = "kannada-text";
                            kannadaDiv.textContent = `${row.kn} - ${item[`kn_${row.key}`]}`;
                            gridItem.appendChild(kannadaDiv);
                        }
                        componentGrid.appendChild(gridItem);
                    });

                    tdComponent.appendChild(componentGrid);
                    tr.appendChild(tdComponent);

                    const tdStatus = document.createElement("td");
                    tdStatus.textContent = item.Status || "-";
                    if (item.Status && item.Status.toLowerCase() === 'emergency') {
                        tdStatus.classList.add('status-emergency');
                    }
                    tr.appendChild(tdStatus);

                    tbody.appendChild(tr);
                }

                requestAnimationFrame(() => {
                    const firstRow = tbody.querySelector("tr");
                    if (firstRow) {
                        const style = window.getComputedStyle(firstRow);
                        rowHeight = parseFloat(style.height);
                    }
                    if (rowHeight > 0) {
                        rowsPerPage = Math.floor(viewport.clientHeight / rowHeight);
                    }
                    currentIndex = 0;
                    setScrollTop(0, false);
                    resolve();
                });
            });
        }

        function goToPage(pageIdx) {
            if (rowsPerPage === 0) return;

            currentIndex = Math.min(pageIdx * rowsPerPage, Math.max(0, bloodData.length - 1));
            const offset = currentIndex * rowHeight;
            setScrollTop(offset, true);
            const pageCount = Math.ceil(bloodData.length / rowsPerPage);
            pageInfo.textContent = `${Math.floor(currentIndex / rowsPerPage) + 1} of ${pageCount} • ${bloodData.length} items`;
        }

        function stepPager() {
            if (document.hidden || bloodData.length <= rowsPerPage) return;

            const pageCount = Math.ceil(bloodData.length / rowsPerPage);
            const currentPage = Math.floor(currentIndex / rowsPerPage);
            let nextPage = (currentPage + 1);

            if (nextPage >= pageCount) {
                sleep(SLIDE_MS, () => setScrollTop(0, false));
                nextPage = 0;
            }

            goToPage(nextPage);
        }

        function startPager() {
            stopPager();
            pageTimer = setInterval(stepPager, PAGE_HOLD_MS);
        }

        function stopPager() {
            if (pageTimer) clearInterval(pageTimer);
            pageTimer = null;
        }

        async function refreshLoop() {
            const payload = await fetchData();
            if (!payload) {
                meta.textContent = "Error fetching data";
                return;
            }

            const list = Array.isArray(payload) ? payload : [];
            const newHash = hashData(list);

            if (newHash !== lastHash) {
                bloodData = list;
                await renderRows(bloodData);
                lastHash = newHash;
                goToPage(0);
            }

            meta.textContent = `Last updated: ${new Date().toLocaleTimeString('en-US', { hour: 'numeric', minute: 'numeric', hour12: true })}`;
        }

        function startRefresh() {
            stopRefresh();
            refreshLoop();
            refreshTimer = setInterval(refreshLoop, REFRESH_MS);
        }

        function stopRefresh() {
            if (refreshTimer) clearInterval(refreshTimer);
            refreshTimer = null;
        }

        document.addEventListener("visibilitychange", () => {
            if (document.hidden) {
                stopPager();
            } else {
                renderRows(bloodData).then(() => {
                    startPager();
                });
            }
        });

        window.addEventListener("resize", () => {
            if (!bloodData.length) return;
            renderRows(bloodData).then(() => {
                goToPage(0);
            });
        });

        fetchAlerts();
        startRefresh();
        startPager();
    </script>
</body>

</html>
