<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Blood Components Inventory</title>
    <style>
        :root {
            --header-height: 10vh;
            --footer-height: 5vh;
            --primary-text: #111;
            --secondary-text: #555;
            --bg-light: #f9fafb;
            --bg-white: #fff;
            --border-color: #e5e7eb;
            --table-header-bg: #f3f4f6;
            --emergency-red: #dc2626;
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: Arial, sans-serif;
            background: var(--bg-light);
            color: var(--primary-text);
            height: 100vh;
            display: flex;
            flex-direction: column;
            overflow: hidden;
        }

        header {
            display: flex;
            align-items: center;
            justify-content: space-between;
            padding: 0 2vw;
            height: var(--header-height);
            background: var(--bg-white);
            border-bottom: 2px solid var(--border-color);
            flex-shrink: 0;
        }

        header img {
            height: 8vh;
            flex-shrink: 0;
        }

        header .title-container {
            text-align: center;
            flex-grow: 1;
        }

        header h1 {
            margin: 0;
            font-size: 4vh;
            font-weight: bold;
        }

        header h2 {
            margin: 0;
            font-size: 2.5vh;
            font-weight: normal;
            color: var(--secondary-text);
        }

        .main-container {
            flex-grow: 1;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            padding: 20px;
            overflow: hidden;
        }

        .content-wrapper {
            background: var(--bg-white);
            border-radius: 15px;
            box-shadow: 0 10px 30px rgba(0, 0, 0, 0.1);
            padding: 40px;
            width: 95%;
            max-width: 1600px;
            display: flex;
            flex-direction: column;
            transition: opacity 0.5s ease;
        }

        .component-header {
            text-align: center;
            margin-bottom: 30px;
        }

        .component-header h1 {
            color: var(--primary-text);
            font-size: 4.5vh;
            font-weight: bold;
            text-transform: uppercase;
            letter-spacing: 2px;
        }
        
        .component-header h2 {
            color: var(--secondary-text);
            font-size: 3vh;
            font-weight: normal;
        }

        .grid-container {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 30px;
            margin-bottom: 30px;
        }

        .table-wrapper {
            border: 1px solid var(--border-color);
            border-radius: 10px;
            overflow: hidden;
        }

        table {
            width: 100%;
            border-collapse: collapse;
        }

        thead th {
            background: var(--table-header-bg);
            padding: 2vh;
            font-size: 3vh;
            font-weight: bold;
            text-transform: uppercase;
            text-align: center;
        }

        thead th .kannada-text {
            font-size: 2.2vh;
            font-weight: normal;
            color: var(--secondary-text);
        }

        thead th:first-child {
            border-right: 1px solid var(--border-color);
        }

        tbody tr:nth-child(even) {
            background-color: var(--table-header-bg);
        }

        tbody td {
            padding: 2.5vh;
            text-align: center;
            font-size: 3.5vh;
            font-weight: bold;
            border-bottom: 1px solid var(--border-color);
        }

        tbody tr:last-child td {
            border-bottom: none;
        }

        tbody td:first-child {
            color: var(--primary-text);
            border-right: 1px solid var(--border-color);
        }

        tbody td:last-child {
            color: var(--emergency-red);
        }

        .total-section {
            background: var(--table-header-bg);
            color: var(--primary-text);
            padding: 25px;
            border-radius: 10px;
            text-align: center;
            display: flex;
            justify-content: center;
            align-items: center;
            gap: 30px;
            margin-top: 20px;
        }

        .total-section .label {
            font-size: 4vh;
            font-weight: bold;
            text-transform: uppercase;
        }
        
        .total-section .label .kannada-text {
            font-size: 3vh;
            font-weight: normal;
            color: var(--secondary-text);
        }

        .total-section .value {
            font-size: 6vh;
            font-weight: bold;
            color: var(--emergency-red);
        }

        .progress-bar {
            width: 100%;
            height: 5px;
            background: var(--border-color);
            border-radius: 3px;
            margin-top: 25px;
            overflow: hidden;
        }

        .progress-fill {
            height: 100%;
            background: var(--emergency-red);
            width: 0%;
            transition: width 0.1s linear;
        }

        .component-indicator {
            text-align: center;
            margin-top: 15px;
            display: flex;
            justify-content: center;
            gap: 10px;
        }

        .indicator-dot {
            width: 12px;
            height: 12px;
            border-radius: 50%;
            background: #ccc;
            transition: all 0.3s;
        }

        .indicator-dot.active {
            background: var(--emergency-red);
            transform: scale(1.2);
        }
        
        footer {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 1vh 2vw;
            border-top: 2px solid var(--border-color);
            font-size: 2.5vh;
            color: var(--secondary-text);
            height: var(--footer-height);
        }

        @media (max-width: 768px) {
            .grid-container {
                grid-template-columns: 1fr;
            }

            .component-header h1 {
                font-size: 22px;
            }

            tbody td {
                font-size: 16px;
                padding: 12px;
            }

            .total-section .label {
                font-size: 20px;
            }

            .total-section .value {
                font-size: 30px;
            }
        }
    </style>
</head>

<body>
    <header>
        <img src="./wenlock_logo.png" alt="Wenlock Logo">
        <div class="title-container">
            <h1>Blood Availability</h1>
            <h2>ರಕ್ತ ಲಭ್ಯತೆ</h2>
        </div>
    </header>

    <div class="main-container">
        <div class="content-wrapper">
            <div class="component-header">
                <h1 id="component-title"></h1>
                <h2 id="component-title-kn"></h2>
            </div>

            <div class="grid-container" id="tables-container">
            </div>

            <div class="total-section">
                <span class="label">
                    <div>Total Units</div>
                    <div class="kannada-text">ಒಟ್ಟು ಘಟಕಗಳು</div>
                </span>
                <span class="value" id="total">0</span>
            </div>

            <div class="progress-bar">
                <div class="progress-fill" id="progress"></div>
            </div>
        </div>
    </div>

    <footer>
        <span id="time"></span>
        <div class="component-indicator" id="indicators"></div>
    </footer>

    <script>
        let components;
        let currentIndex = 0;
        let autoplayInterval;
        let progressInterval;
        let progressValue = 0;
        const displayDuration = 5000;
        const progressStep = 100 / (displayDuration / 100);

        async function getKannadaTransliteration(text) {
            if (!text || typeof text !== 'string') return text;
            try {
                const words = text.split(' ');
                const transliteratedWords = await Promise.all(words.map(async (word) => {
                    const response = await fetch(`https://transliteration.devnagri.com/api/tl/kn/${word}`);
                    const data = await response.json();
                    if (data && data.success && data.result) {
                        return data.result[0];
                    }
                    return word;
                }));
                return transliteratedWords.join(' ');
            } catch (err) {
                console.error("Transliteration error:", err);
                return text;
            }
        }

        async function initialize() {
            await tally();
            if (components && components.length > 0) {
                createIndicators();
                updateDisplay();
                startAutoplay();
            }
            updateTime();
            setInterval(updateTime, 1000);
        }

        function updateTime() {
            const timeEl = document.getElementById("time");
            if (timeEl) {
                const now = new Date();
                timeEl.textContent = `Last Updated: ${now.toLocaleTimeString('en-US', { hour: 'numeric', minute: 'numeric', hour12: true })}`;
            }
        }

        function createIndicators() {
            const indicatorContainer = document.getElementById("indicators");
            indicatorContainer.innerHTML = "";
            components.forEach((comp, index) => {
                const dot = document.createElement("div");
                dot.className = "indicator-dot";
                dot.title = comp.name;
                indicatorContainer.appendChild(dot);
            });
        }

        function generateTables(component) {
            const container = document.getElementById("tables-container");
            container.innerHTML = "";

            if (component.shortName === 'Cryo' || !component.data) {
                return;
            }

            const bloodGroups = Object.keys(component.data);
            const halfPoint = Math.ceil(bloodGroups.length / 2);
            const leftGroups = bloodGroups.slice(0, halfPoint);
            const rightGroups = bloodGroups.slice(halfPoint);

            const createTableHTML = (groups) => {
                if (groups.length === 0) return '';
                let tableHTML = `
                    <div class="table-wrapper">
                        <table>
                            <thead>
                                <tr>
                                    <th><div>Blood Group</div><div class="kannada-text">ರಕ್ತದ ಗುಂಪು</div></th>
                                    <th><div>Units</div><div class="kannada-text">ಘಟಕಗಳು</div></th>
                                </tr>
                            </thead>
                            <tbody>`;
                groups.forEach(group => {
                    tableHTML += `
                        <tr>
                            <td>${group}</td>
                            <td class="value">${component.data[group]}</td>
                        </tr>`;
                });
                tableHTML += `</tbody></table></div>`;
                return tableHTML;
            };

            container.innerHTML = createTableHTML(leftGroups) + createTableHTML(rightGroups);
        }

        function updateDisplay() {
            const component = components[currentIndex];
            const titleEl = document.getElementById("component-title");
            const titleKnEl = document.getElementById("component-title-kn");
            const wrapper = document.querySelector('.content-wrapper');

            wrapper.style.opacity = "0";

            setTimeout(() => {
                titleEl.textContent = component.name;
                titleKnEl.textContent = component.kn_name || '';
                generateTables(component);
                calculateTotal();
                updateIndicators();
                resetProgress();
                wrapper.style.opacity = "1";
            }, 300);
        }

        function calculateTotal() {
            const component = components[currentIndex];
            let total = 0;
            if (component.data) {
                total = Object.values(component.data).reduce((sum, val) => sum + val, 0);
            }
            document.getElementById("total").textContent = total;
        }

        function updateIndicators() {
            const dots = document.querySelectorAll(".indicator-dot");
            dots.forEach((dot, index) => {
                dot.classList.toggle("active", index === currentIndex);
            });
        }

        function nextComponent() {
            currentIndex = (currentIndex + 1) % components.length;
            updateDisplay();
        }

        async function tally() {
            const SECRET_KEY = "lasdfaldf234232wqa122fsvsdlfjsdvnsasifjweiojsadlflkasdjflkasjflk32234234edswdsjfflas2 3rsd";
            const baseUrl = "https://script.google.com/macros/s/AKfycbxPx3ir07CcJGv4cahv7YXkGiXP7zrk3IuNmIAgwKJ9f1imf5L3nDfDIM6mdsCF7_L4tA/exec";
            try {
                const response = await fetch(`${baseUrl}?key=${SECRET_KEY}&sheet=Stock%20Availability`);
                if (!response.ok) throw new Error(`HTTP error! status: ${response.status}`);
                const fetchedComponents = await response.json();
                
                components = await Promise.all(fetchedComponents.map(async (comp) => {
                    const kn_name = await getKannadaTransliteration(comp.name);
                    return { ...comp, kn_name };
                }));

            } catch (error) {
                console.error("Error fetching data:", error);
                components = [];
            }
        }

        function resetProgress() {
            progressValue = 0;
            document.getElementById("progress").style.width = "0%";
        }

        function updateProgress() {
            progressValue += progressStep;
            if (progressValue >= 100) {
                progressValue = 100;
            }
            document.getElementById("progress").style.width = `${progressValue}%`;
        }

        function startAutoplay() {
            clearInterval(autoplayInterval);
            clearInterval(progressInterval);

            autoplayInterval = setInterval(nextComponent, displayDuration);
            progressInterval = setInterval(updateProgress, 100);
        }

        initialize();
    </script>
</body>

</html>
