<!doctype html>
<html lang="en">

<head>
    <meta charset="utf-8">
    <title>Available Medicines</title>
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <style>
        *,
        *::before,
        *::after {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            font-family: Arial, sans-serif;
            background: #f9fafb;
            color: #111;
            display: flex;
            flex-direction: column;
            height: 100vh;
            overflow: hidden;
        }

        header {
            background: #fff;
            border-bottom: 2px solid #e5e7eb;
            flex-shrink: 0;
            padding: 0 2vw;
            height: 10vh;
        }

        header img {
            width: 100%;
            height: 100%;
            object-fit: contain;
        }

        main {
            flex: 1;
            overflow: hidden;
            height: calc(100vh - 15vh);
        }

        #scrollViewport {
            height: 100%;
            overflow: hidden;
            background: #fff;
        }

        table {
            width: 100%;
            border-collapse: collapse;
        }

        tbody {
            transition: transform 0.8s ease;
        }

        td {
            padding: 1.5vh 2vw;
            font-weight: bold;
            font-size: 4.5vh;
            vertical-align: middle;
            background-color: #fff;
        }

        tr:nth-child(even) td {
            background-color: #f3f4f6;
        }

        td.name {
            text-align: center;
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
        }

        td.status {
            text-align: center;
            color: #fff;
            background-color: #16a34a !important;
            min-width: 20vw;
            white-space: nowrap;
            border-bottom: 2px solid #d1d5db;
        }

        .empty {
            padding: 40px 20px;
            text-align: center;
            color: #6b7280;
            font-size: 18px;
            display: none;
        }

        footer {
            display: flex;
            justify-content: space-between;
            padding: 1vh 2vw;
            border-top: 2px solid #e5e7eb;
            font-size: 2.5vh;
            color: #374151;
            height: 5vh;
        }
    </style>
</head>

<body>
    <header>
        <img src="./wenlock_logo.png" alt="Wenlock Logo">
    </header>

    <main>
        <div id="scrollViewport">
            <table>
                <tbody id="medBody"></tbody>
            </table>
        </div>
        <div id="empty" class="empty">No medicines available</div>
    </main>
    <script>
        const PAGE_HOLD_MS = 4200;
        const SLIDE_MS = 800;
        const REFRESH_MS = 30000;

        const tbody = document.getElementById("medBody");
        const viewport = document.getElementById("scrollViewport");
        const empty = document.getElementById("empty");
        const meta = document.getElementById("meta");

        let medicines = [];
        let currentIndex = 0;
        let rowHeight = 0;
        let pageTimer = null;
        let refreshTimer = null;
        let lastHash = "";
        let rowsPerPage = 0;

        function sleep(ms, cb) {
            setTimeout(cb, ms);
        }

        async function fetchData() {
            try {
                const response = await fetch('/medicines');
                if (!response.ok) {
                    throw new Error(`HTTP error, status = ${response.status}`);
                }
                const data = await response.json();
                return data;
            } catch (error) {
                console.error("Error fetching data:", error);
                return null;
            }
        }

        function hashData(list) {
            return JSON.stringify(list.map(item => item.name));
        }

        function setTransform(yPx, withTransition) {
            tbody.style.transition = withTransition ? `transform ${SLIDE_MS}ms ease` : "none";
            tbody.style.transform = `translateY(${yPx}px)`;
        }

        function renderRows(data) {
            return new Promise(resolve => {
                tbody.innerHTML = "";
                if (!data || data.length === 0) {
                    empty.style.display = "block";
                    resolve();
                    return;
                }
                empty.style.display = "none";
                for (let i = 0; i < data.length; i++) {
                    const m = data[i];
                    const tr = document.createElement("tr");

                    const tdName = document.createElement("td");
                    tdName.className = "name";

                    const englishName = document.createElement("div");
                    englishName.textContent = (m.name || "").toUpperCase();
                    tdName.appendChild(englishName);

                    if (m.kn_name) {
                        const kannadaName = document.createElement("div");
                        kannadaName.textContent = m.kn_name;
                        kannadaName.style.fontSize = "2.5vh";
                        kannadaName.style.color = "#555";
                        tdName.appendChild(kannadaName);
                    }

                    tr.appendChild(tdName);

                    const tdStatus = document.createElement("td");
                    tdStatus.className = "status";
                    tdStatus.textContent = "AVAILABLE";
                    tr.appendChild(tdStatus);

                    tbody.appendChild(tr);
                }

                requestAnimationFrame(() => {
                    const firstRow = tbody.querySelector("tr");
                    if (firstRow) {
                        const style = window.getComputedStyle(firstRow);
                        rowHeight = parseFloat(style.height);
                    }
                    if (rowHeight > 0) {
                        rowsPerPage = Math.floor(viewport.clientHeight / rowHeight);
                    }
                    currentIndex = 0;
                    setTransform(0, false);
                    resolve();
                });
            });
        }

        function goToPage(pageIdx) {
            if (rowsPerPage === 0) return;

            currentIndex = Math.min(pageIdx * rowsPerPage, Math.max(0, medicines.length - 1));
            const offset = -(currentIndex * rowHeight);
            setTransform(offset, true);
            const pageCount = Math.ceil(medicines.length / rowsPerPage);
            
        }        function stepPager() {
            if (document.hidden || medicines.length <= rowsPerPage) return;

            const pageCount = Math.ceil(medicines.length / rowsPerPage);
            const currentPage = Math.floor(currentIndex / rowsPerPage);
            let nextPage = (currentPage + 1) % pageCount;

            if (nextPage === 0) {
                sleep(SLIDE_MS, () => setTransform(0, false));
            }

            goToPage(nextPage);
        }

        function startPager() {
            stopPager();
            pageTimer = setInterval(stepPager, PAGE_HOLD_MS);
        }

        function stopPager() {
            if (pageTimer) clearInterval(pageTimer);
            pageTimer = null;
        }

        async function refreshLoop() {
            const payload = await fetchData();
            if (!payload) {
                meta.textContent = "Error fetching data";
                return;
            }

            const list = payload.filter(m => m.available);
            const newHash = hashData(list);

            if (newHash !== lastHash) {
                medicines = list;
                await renderRows(medicines);
                lastHash = newHash;
                goToPage(0);
            }

            meta.textContent = `Last updated: ${new Date().toLocaleTimeString()}`;
        }

        function startRefresh() {
            stopRefresh();
            refreshLoop();
            refreshTimer = setInterval(refreshLoop, REFRESH_MS);
        }

        function stopRefresh() {
            if (refreshTimer) clearInterval(refreshTimer);
            refreshTimer = null;
        }

        document.addEventListener("visibilitychange", () => {
            if (document.hidden) {
                stopPager();
            } else {
                renderRows(medicines).then(() => {
                    startPager();
                });
            }
        });

        window.addEventListener("resize", () => {
            if (!medicines.length) return;
            renderRows(medicines).then(() => {
                goToPage(0);
            });
        });

        startRefresh();
        startPager();
    </script>
</body>

</html>
